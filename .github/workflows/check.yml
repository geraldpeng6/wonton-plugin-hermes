name: 检查

on:
  pull_request:
  push:
    branches: [main]
  # 手动入口：想合并前跑一遍冒烟时，从这里触发（冒烟作业只在 Dependabot 的 PR 和手动触发时跑）。
  workflow_dispatch:
    inputs:
      core-image:
        description: 核心镜像（如 ghcr.io/wontonapp/wonton-core:sha-<完整 40 位提交号>，钉在某次合并上复测；留空用仓库变量 WONTON_CORE_IMAGE，再留空用套件默认的 :main）
        required: false
        type: string
        default: ''
      upgrade-from:
        description: 冒烟“升级保数据”的起点（提交或 tag，只在本次运行里打本地 tag，不推）；留空取最近的 tag
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    uses: geraldpeng6/wonton-plugin-template/.github/workflows/plugin-check.yml@4d07ce60e8d39505037d66a13aa185b113149a35
    with:
      # 优先级：手动触发填的输入 > 仓库变量 WONTON_CORE_IMAGE（要固定别的核心镜像，例如套件默认镜像
      # 还没有某个新能力时，在仓库 Settings → Variables 里设）> 套件默认（空，走 scripts/lib.sh 的默认值）。
      core-image: ${{ inputs.core-image || vars.WONTON_CORE_IMAGE }}
      upgrade-from: ${{ inputs.upgrade-from }}

  locale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 验证官方 Hermes 中的四语报错和语言隔离
        run: |
          docker run --rm --network none \
            --entrypoint /opt/hermes/.venv/bin/python \
            -v "$PWD:/plugin:ro" -w /plugin \
            nousresearch/hermes-agent:v0.22.7@sha256:e6d81ae52ebf6a43efa529701405509f20054ba818f179ddd748bed4f8af584c \
            -m unittest discover -s tests/hermes -v
