# Wonton 给 Hermes 的初始配置：首次启动时由 init 服务写成数据目录里的 config.yaml，之后不覆盖
# （Hermes 自己也会改写它，比如 /model）。
#
# 模型只走 magpie。地址、凭据和默认模型都来自核心注入的环境变量，Hermes 会展开 ${VAR}：
#   WONTON_MODEL_BASE_URL  magpie 网关的 OpenAI 兼容地址
#   WONTON_MODEL_API_KEY   magpie 发给本插件的网关凭据（Hermes 用 key_env 读取，不落盘）
#   WONTON_MODEL_DEFAULT   默认模型，指向 magpie 的路由组；换 provider 或模型只在 magpie 里改
model:
  provider: custom:magpie
  default: ${WONTON_MODEL_DEFAULT}

providers:
  magpie:
    api: ${WONTON_MODEL_BASE_URL}
    key_env: WONTON_MODEL_API_KEY
    transport: chat_completions
    # 网关凭据只允许用默认路由组，列模型没有意义。
    discover_models: false
    models:
      - ${WONTON_MODEL_DEFAULT}
    # 路由组里各成员窗口的下限；Hermes 要求至少 64K。
    context_length: 128000

# Matrix 的行为设置（身份和令牌由核心经环境变量注入）。只收发消息：不加处理中的表情回应、
# 房间里不自动开线程，重启前后也不往聊天里发状态消息。
# Matrix 的 reply_to_mode 在 v0.22.7 仍无效；适配器给回复附上触发消息的引用。
platforms:
  matrix:
    reactions: false
    auto_thread: false
    gateway_restart_notification: false
    # 斜杠命令管理员（DM 范围）：!approvals 和 !yolo 只认名单里的人。核心注入的 WONTON_MATRIX_ALLOWED_USERS
    # 是 Bot 听的人（逗号分隔，第一个是归属人）；init 只取第一个 ID 写进来，家人加进听名单也拿不到审批开关。
    allow_admin_from: "${WONTON_MATRIX_ALLOWED_USERS}"

# 只收发消息：Matrix 里不展示工具调用和推理，只发回答。要主人确认的工具（装卸插件等）会一直等主人回答，所以
# 打开中间消息：模型在调用前说的那句话（告诉主人要确认）先发出去；确认卡片出现在发起的聊天里，主人才知道去确认。
display:
  # Bot 忙时收到的新消息排队，按顺序逐条回答；不打断当前回答，也不发“正在打断”之类的提示。
  busy_input_mode: queue
  busy_ack_enabled: false
  # 后台的自我整理照常跑，只是不把“💾 Self-improvement review”这类提示发进聊天。
  memory_notifications: "off"
  platforms:
    matrix:
      tool_progress: "off"
      show_reasoning: false
      interim_assistant_messages: true
      long_running_notifications: false
      busy_ack_detail: false
      streaming: false

# 群聊里每个人各自一段会话，互不共享上下文。
group_sessions_per_user: true

# 主人还没有设备时发进加密房间的低磁盘提问，配对后也解不开；显式关闭只是不再询问，自动清理仍按上游默认关闭。
sessions:
  auto_prune: false

# 危险命令先经上游审批：显式写 smart（与上游默认一致，不依赖默认值）。命中上游危险规则的命令由辅助模型的
# 「守卫」逐条评估：明显安全的放行，明确破坏性的拒绝，拿不准或守卫不可用的升级成人工审批，在发起的聊天里等
# 主人回答；300 秒没人回答按拒绝处理（上游 fail-closed）。要每条命中危险规则的命令都人工放行，私聊发
# `!approvals manual`；这个切换和 `!yolo` 只有管理员名单里的人能改（见 platforms.matrix.allow_admin_from）。
# 经 Wonton MCP 的操作不走这里，仍由核心出确认卡片。
approvals:
  mode: smart
  # 守卫默认规则：上游 tools/approval_smart.py 把这段文本逐字拼进守卫模型的 system prompt（trusted 通道，
  # v0.22.7）。英文书写、沿用上游 approval.py 的分类词，守卫照它把这几类判成 ESCALATE 转人工，不再自动放行。
  # 守卫只看得到上游危险规则命中的命令：普通 sudo、doas、crontab、docker run/start/rm、compose up、
  # 非递归 rm/rmdir 上游不命中，不会因此出卡片。init 只在本项缺失或为空时补同一份默认（取自包里的
  # config.yaml），主人自己写的规则不动。
  smart_policy: |
    The following categories are always the owner's call: if the command does any of
    these, respond ESCALATE (never APPROVE), even if it looks routine.
    1. Privilege escalation: any command run through sudo or doas.
    2. System configuration: writing or editing files under /etc, changing service state
       with systemctl (start, stop, restart, reload, enable, disable, mask), editing
       crontabs, or modifying shell startup files (~/.bashrc, ~/.zshrc, ~/.profile and
       similar).
    3. Container lifecycle: creating, starting, stopping, restarting, killing or removing
       containers (docker/podman run/start/stop/restart/kill/rm), or bringing compose
       stacks up or down.
    4. Deletion outside the workspace: rm, rmdir, find -delete or similar removals whose
       targets are not inside the agent's working directory (relative paths are inside;
       absolute paths elsewhere are outside).
    Everything not listed here follows the base rules above.

# Wonton 的 Hermes 插件（包里的 wonton/，init 服务放进数据目录）：模型网关里还没有默认模型时，直接告诉主人去
# 「模型设置」添加模型服务商，不把网关的报错发进聊天。
plugins:
  enabled: [wonton]

# 工具经核心的 MCP 总线（插件规范的“工具与 MCP 总线”），地址由核心注入（WONTON_MCP_URL）。装卸插件和会改数据的
# 工具要主人在 Wonton App 里确认，调用一直等到主人回答再加上执行的时间。主人正在操作这个插件时先停住最多 10 分钟，
# 卡片再等最多 10 分钟，所以 MCP 调用和工具调用的超时都放宽到 30 分钟（默认 300 秒和 420 秒）。
mcp_servers:
  wonton:
    url: ${WONTON_MCP_URL}
    timeout: 1800

# 关掉上游自带的 Obsidian 笔记技能：它的职责是把笔记存进 Obsidian 库，没配 OBSIDIAN_VAULT_PATH 时落到
# 这个 Bot 数据目录里的 ~/Documents/Obsidian Vault——主人从任何界面都看不到这个目录，让记到 Wonton 应用
# （如 Memos）的内容就这样悄悄存丢。云吞里记笔记用 Memos 的工具（见 wonton 插件每轮带的引导）。
# 主人想用 Obsidian 库：改数据目录 config.yaml 的这份名单，并把 OBSIDIAN_VAULT_PATH 指到看得见的存储。
# init 对缺这项的已有 Bot 补同一份（见 init_config.py），主人自己写过的名单不动。
skills:
  disabled: [obsidian]

timeouts:
  tools:
    sequential_call: 1800
    concurrent_batch: 1800
